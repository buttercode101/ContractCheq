plugins { id 'com.android.application' }
android {
 namespace 'com.buttercode.mobile'
 compileSdk 36
 defaultConfig { applicationId 'za.co.buttercode.contractcheck'; minSdk 26; targetSdk 36; versionCode 2; versionName '0.1.1-internal'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  buildConfigField 'String','APP_ORIGIN','"https://contractcheck.online"'
  buildConfigField 'boolean','SCREEN_CAPTURE','false'
  buildConfigField 'boolean','BUNDLED_OFFLINE','false'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 signingConfigs {
  upload {
   if (System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH')) {
    storeFile file(System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH'))
    storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
    keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if(System.getenv('ANDROID_UPLOAD_KEYSTORE_PATH')) signingConfig signingConfigs.upload } }
 lint { abortOnError true }
 testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.14.0'
 implementation 'androidx.core:core:1.16.0'
 implementation 'androidx.activity:activity:1.10.1'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test:core:1.6.1'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

tasks.configureEach { if(name=='connectedDebugAndroidTest') outputs.upToDateWhen {false} }
