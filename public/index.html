async function track(name, props) {
  try {
    await fetch(API + '/api/events', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, props: props || {}})
    });
  } catch (e) {}
}

function loadLS() {
  try {
    const value=JSON.parse(localStorage.getItem('cc_v3') || '{}');
    if(!value || typeof value!=='object' || Array.isArray(value))return {};
    return {credits:Number.isInteger(value.credits)&&value.credits>=0?value.credits:0,
      unlocked:Array.isArray(value.unlocked)?value.unlocked.filter(x=>typeof x==='string'):[],
      email:typeof value.email==='string'?value.email:'',paymentRef:typeof value.paymentRef==='string'?value.paymentRef:'',pendingReceipt:typeof value.pendingReceipt==='string'?value.pendingReceipt:'',
      notes:value.notes&&typeof value.notes==='object'&&!Array.isArray(value.notes)?Object.fromEntries(Object.entries(value.notes).filter(([,v])=>typeof v==='string')):{},
      lastPaidReport:value.lastPaidReport&&['analysisId','reference','email'].every(k=>typeof value.lastPaidReport[k]==='string'&&value.lastPaidReport[k].length>0&&value.lastPaidReport[k].length<300)?value.lastPaidReport:null};
  } catch (e) { return {}; }
}
function saveLS(p) {
  try { localStorage.setItem('cc_v3', JSON.stringify(Object.assign({}, loadLS(), p))); return true; } catch(e) { return false; }
}

    note:'M5 3h14v18H5zM9 8h6m-6 4h6m-6 4h3', external:'M14 3h7v7m0-7L10 14M10 3H3v18h18v-7', briefcase:'M9 7V4h6v3M3 7h18v13H3zM3 12h18m-9-2v4'

  return h('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:1.7,strokeLinecap:'round',strokeLinejoin:'round','aria-hidden':true,focusable:false},h('path',{d:paths[name]||paths.document}));

function Gauge({score=0,level=''}) {
  const r=54,c=2*Math.PI*r,pct=Math.min(100,Math.max(0,score))/100;
  const col=score>=70?'#cb3e36':score>=40?'#a96813':'#166653';
  return h('div',{className:'risk-gauge','aria-label':score+' out of 100, '+level},
    h('svg',{viewBox:'0 0 140 140','aria-hidden':true},h('g',{transform:'rotate(-135 70 70)'},
      h('circle',{cx:70,cy:70,r,fill:'none',stroke:'#e8ece7',strokeWidth:9,strokeDasharray:c*.75+' '+c}),
      h('circle',{cx:70,cy:70,r,fill:'none',stroke:col,strokeWidth:9,strokeLinecap:'round',strokeDasharray:c*.75+' '+c,strokeDashoffset:c*.75*(1-pct)}))),
    h('div',{className:'gauge-label'},h('strong',null,score),h('span',null,'out of 100'),h('b',{style:{color:col}},level)));
}
function trapFocus(e) {
  if(e.key!=='Tab')return;
  const items=Array.from(e.currentTarget.querySelectorAll('button:not([disabled]),input,textarea,a[href]')).filter(x=>x.getClientRects().length);
  const first=items[0],last=items[items.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}

function PlainLanguageGuide({guide}) {
  const [query,setQuery]=useState('');
  const [limit,setLimit]=useState(20);
  if(!guide)return h('section',{className:'plain-guide',id:'report-guide',tabIndex:-1},h('h2',null,'Your contract, in everyday language'),h('p',null,'No reading guide was saved with this older report. Upload the current agreement for a new scan.'));
  const sections=guide.sections||[];
  const filtered=sections.filter(s=>[s.original,s.title,s.explanation,...s.glossary.map(t=>t.term)].join(' ').toLowerCase().includes(query.toLowerCase().trim()));
  const amounts=sections.flatMap(s=>s.amounts.map(value=>({value,source:s.sourceLabel})));
  const timings=sections.flatMap(s=>s.timeTerms.map(value=>({value,source:s.sourceLabel})));
  return h('section',{className:'plain-guide',id:'report-guide',tabIndex:-1,'aria-labelledby':'plain-guide-title'},
    h('div',{className:'eyebrow'},'Included in every paid report'),
    h('h2',{id:'plain-guide-title'},'Your contract, in everyday language'),
    h('p',{className:'guide-intro'},guide.overview),
    h('p',{className:'guide-coverage'},guide.coverage.includedSections+' of '+guide.coverage.totalSections+' extracted text sections included. '+guide.coverage.needsReview+(guide.coverage.needsReview===1?' needs':' need')+' closer reading.'),
    guide.coverage.limited&&h('p',{role:'status',className:'extraction-warning'},'Guide limit reached: only the first 400 text sections are included. Read the remaining agreement separately.'),
    h('div',{className:'guide-facts'},[['Money mentioned',amounts],['Dates and time periods',timings]].map(([label,items])=>h('div',{key:label},h('h3',null,label),items.length?h('ul',null,items.slice(0,8).map((item,i)=>h('li',{key:i},h('strong',null,item.value),h('span',null,item.source))),items.length>8&&h('li',null,'More appear in the section guide below.')):h('p',null,'No matching wording recognised. Check the original agreement.')))),
    h('details',{className:'guide-checklist'},h('summary',null,'Things to confirm before agreeing'),h('ul',null,guide.checklist.map(item=>h('li',{key:item.title},h('strong',null,item.title+' — '+(item.found?'wording recognised':'check the agreement')),h('p',null,item.note))))),
    h('label',{className:'guide-search-label',htmlFor:'guide-search'},'Find wording in your contract'),
    h('input',{id:'guide-search',type:'search',placeholder:'Try deposit, notice, liability or a clause number',value:query,onChange:e=>{setQuery(e.target.value);setLimit(20);}}),
    h('p',{className:'guide-result-count',role:'status','aria-live':'polite'},filtered.length+' matching text sections'+(filtered.length>limit?' · showing the first '+limit:'')),
    h('div',{className:'guide-sections'},filtered.slice(0,limit).map(section=>h('details',{key:section.id,className:'guide-clause',id:'guide-'+section.id},
      h('summary',null,h('span',null,h('small',null,section.sourceLabel+(section.needsReview?' · needs closer reading':'')),h('strong',null,section.title))),
      h('div',{className:'guide-clause-body'},
        h('h3',null,'What this part is about'),h('p',null,section.explanation),
        section.wordingChanged&&h(React.Fragment,null,h('h3',null,'In simpler words'),h('p',{className:'guide-rewording'},section.simplerWording)),
        h('h3',null,'Original wording'),h('blockquote',null,section.original),
        (section.amounts.length>0||section.timeTerms.length>0)&&h('p',null,h('strong',null,'Keep these details: '),[...section.amounts,...section.timeTerms].join(' · ')),
        section.qualifiers.length>0&&h('p',{className:'guide-attention'},h('strong',null,'Words that change the meaning: '),section.qualifiers.join(' · '),'. Read them with the whole sentence; they may limit or protect a right.'),
        section.crossReferences.length>0&&h('p',{className:'guide-attention'},'Read the linked wording too: '+section.crossReferences.join(', ')+'. It may change this section. An attachment may not have been uploaded.'),
        section.glossary.length>0&&h('dl',{className:'guide-glossary'},section.glossary.map(term=>h('div',{key:term.term},h('dt',null,term.term),h('dd',null,term.meaning)))),
        section.questions.length>0&&h(React.Fragment,null,h('h3',null,'Questions to ask'),h('ul',null,section.questions.map(question=>h('li',{key:question},question)))))))),
    filtered.length===0&&h('p',null,'No text sections match. Try another word; this does not mean the term is absent from the complete contract.'),
    filtered.length>limit&&h('button',{type:'button',className:'secondary-button',onClick:()=>setLimit(n=>n+20)},'Show 20 more text sections'),
    h('p',{className:'guide-caveat'},guide.caveat));
}

function viewForPath(pathname){const p=(pathname||'/').replace(/^\/+|\/+$/g,'');return p==='faq'?'pricing':['privacy','terms','contact','pricing'].includes(p)?p:'landing';}

function App() {
  const [ls] = useState(loadLS);
  var _s = useState(function(){return viewForPath(window.location.pathname);}); var view = _s[0]; var setView = _s[1];
  var _c = useState({paystackPublicKey: '', prices: {single: 1900, pack3: 3900, pack10: 9900}, maxFileMb: 4}); var config = _c[0]; var setConfig = _c[1];
  var _ok = useState('…'); var serverOk = _ok[0]; var setServerOk = _ok[1];
  var _j = useState('ZA'); var jurisdiction = _j[0]; var setJurisdiction = _j[1];
  var _en = useState(false); var enrichLLM = _en[0]; var setEnrichLLM = _en[1];
  var _sc = useState(false); var scanning = _sc[0]; var setScanning = _sc[1];
  var _sm = useState(''); var scanMsg = _sm[0]; var setScanMsg = _sm[1];
  const [checkout,setCheckout] = useState(null);
  const [notice,setNotice] = useState('');
  const [dragging,setDragging] = useState(false);
  const [menuOpen,setMenuOpen] = useState(false);
  const [storageError,setStorageError] = useState(false);
  const [unlocking,setUnlocking] = useState(false);
  const overlayOpener=useRef(null);
  const suppressOverlayFocus=useRef(false);
  const initialView=useRef(true);
  const reportRequest=useRef(null);
  var _er = useState(''); var error = _er[0]; var setError = _er[1];
  var _r = useState(null); var result = _r[0]; var setResult = _r[1];
  var _u = useState(ls.unlocked || []); var unlocked = _u[0]; var setUnlocked = _u[1];
  var _cr = useState(ls.credits || 0); var credits = _cr[0]; var setCredits = _cr[1];
  const [paymentRef,setPaymentRef] = useState(ls.paymentRef || '');
  var _em = useState(ls.email || ''); var payEmail = _em[0]; var setPayEmail = _em[1];
  var _n = useState(ls.notes || {}); var notes = _n[0]; var setNotes = _n[1];
  const [restoreRef,setRestoreRef]=useState(ls.pendingReceipt || ls.paymentRef || '');
  const [restoring,setRestoring]=useState(false);
  const [recoveredReports,setRecoveredReports]=useState(null);

  useEffect(function() {
    track('page_view', {});
    fetch(API + '/api/config').then(function(r) { return r.json(); }).then(function(c) {
      if(!c.prices || typeof c.prices.single !== 'number')throw new Error('Configuration unavailable');
      setConfig(c);
      setServerOk('online');
    }).catch(function() { setServerOk('offline'); });
  }, []);

  useEffect(function() {
    setStorageError(!saveLS({credits: credits, unlocked: unlocked, email: payEmail, notes: notes, paymentRef: paymentRef}));
  }, [credits, unlocked, payEmail, notes, paymentRef]);

  useEffect(()=>{
    window.scrollTo({top:0,behavior:'instant'});
    if(!initialView.current)document.getElementById('main-content')?.focus({preventScroll:true});
    initialView.current=false;
  },[view]);
  useEffect(()=>{
    if(!checkout&&!menuOpen)return;
    const opener=overlayOpener.current;
    const previous=document.body.style.overflow;
    document.body.style.overflow='hidden';
    const onKey=e=>{if(e.key==='Escape'){setCheckout(null);setMenuOpen(false);}};
    window.addEventListener('keydown',onKey);
    if(menuOpen)document.querySelector('#mobile-menu button')?.focus();
    return ()=>{document.body.style.overflow=previous;window.removeEventListener('keydown',onKey);if(!suppressOverlayFocus.current)opener?.focus({preventScroll:true});suppressOverlayFocus.current=false;};
  },[!!checkout,menuOpen]);
  function cancelReportRequest(){
    const current=reportRequest.current;
    reportRequest.current=null;
    if(current){clearTimeout(current.timer);current.controller.abort();}
    setScanning(false);setScanMsg('');
  }
  function beginReportRequest(){
    cancelReportRequest();
    const current={controller:new AbortController(),timedOut:false};
    current.timer=setTimeout(()=>{current.timedOut=true;current.controller.abort();},75000);
    reportRequest.current=current;
    return current;
  }
  function finishReportRequest(current){
    clearTimeout(current.timer);
    if(reportRequest.current===current){reportRequest.current=null;setScanning(false);setScanMsg('');}
  }
  function go(v){cancelReportRequest();const pathname=['landing','result'].includes(v)?'/':'/'+v;if(window.location.pathname!==pathname)window.history.pushState({},'',pathname);setMenuOpen(false);setError('');setView(v);if(v==='landing')setResult(null);window.scrollTo({top:0,behavior:'instant'});}
  useEffect(()=>{const onBack=()=>{cancelReportRequest();setMenuOpen(false);setCheckout(null);setView(viewForPath(window.location.pathname));};window.addEventListener('popstate',onBack);return()=>window.removeEventListener('popstate',onBack);},[]);
  function beginCheckout(opts){suppressOverlayFocus.current=false;overlayOpener.current=document.activeElement;setCheckout(opts);}
  function rememberPaidReport(full,reference,email){
    setStorageError(!saveLS({lastPaidReport:{analysisId:full._id,reference,email}}));
  }
  async function reopenPaidReport(candidate){
    const saved=candidate&&typeof candidate.analysisId==='string'?candidate:loadLS().lastPaidReport;
    if(!saved||unlocking)return;
    const current=beginReportRequest();setUnlocking(true);setError('');
    try{
      const response=await fetch(API+'/api/unlock-analysis',{method:'POST',headers:{'Content-Type':'application/json'},signal:current.controller.signal,body:JSON.stringify({...saved,reopenOnly:true})});
      const full=await response.json();
      if(reportRequest.current!==current||current.controller.signal.aborted)return;
      if(!response.ok||!full.isPaid){if(response.status===404)saveLS({lastPaidReport:null});throw new Error(full.error||'Could not reopen this report.');}
      rememberPaidReport(full,saved.reference,saved.email);
      setResult(full);setCredits(full.credits||0);setPaymentRef(saved.reference);setPayEmail(saved.email);setUnlocked(u=>[...new Set([...u,full._id])]);
      if(window.location.pathname!=='/')window.history.pushState({},'','/');setView('result');
    }catch(e){if(reportRequest.current===current)setError(current.timedOut?'Reopening took too long. Check your connection and try again.':e.message||'Could not reopen this report.');}
    finally{setUnlocking(false);finishReportRequest(current);}
  }
  function savedReportRecovery(){
    return loadLS().lastPaidReport&&h('section',{className:'receipt-recovery','aria-label':'Saved paid report'},h('h2',null,'Return to your report'),h('p',null,'Reopen the last report unlocked on this device while it is retained for up to 48 hours. This uses no additional credit. Contract text is not saved in this browser shortcut.'),h('button',{className:'secondary-button',type:'button',disabled:unlocking,onClick:reopenPaidReport},unlocking?'Reopening report…':'Reopen last unlocked report'));
  }


  var isUnlocked = result && (result.isPaid === true || result.isDemo === true);

  var openDemo = useCallback(function(key) {
    const current=beginReportRequest();
    setError('');
    fetch(API+'/api/demo/'+encodeURIComponent(key),{signal:current.controller.signal}).then(function(r){return r.json().then(function(data){return {r:r,data:data};});}).then(function(x){
      if(reportRequest.current!==current||current.controller.signal.aborted)return;
      if(!x.r.ok) throw new Error(x.data.error||'Example unavailable');
      setJurisdiction(x.data.jurisdiction||'ZA'); setResult(x.data); setView('result');
      track('demo_open',{id:key,rulesVersion:x.data.rulesVersion}); window.scrollTo({top:0,behavior:'smooth'});
    }).catch(function(e){if(reportRequest.current===current)setError(current.timedOut?'The example took too long to load. Please try again.':'Could not load the current example report: '+e.message);}).finally(()=>finishReportRequest(current));
  }, []);

  var runFile = useCallback(function(file) {
    if (!file) return;
    setError('');
    if(file.size > (config.maxFileMb || 4)*1024*1024){setError('This file is too large. Choose a file under '+(config.maxFileMb || 4)+'MB.');return;}
    if(!/\.(pdf|txt|png|jpg|jpeg|webp|bmp|tif|tiff)$/i.test(file.name)){setError('Choose a PDF, text file, or a clear photo of your document.');return;}
    const current=beginReportRequest();
    setScanning(true);
    setScanMsg('Reading document…');
    track('upload_start', {jurisdiction: jurisdiction, name: file.name});
    var fd = new FormData();
    fd.append('file', file);
    fd.append('jurisdiction', jurisdiction);
    if (enrichLLM) fd.append('enrich', '1');
    setScanMsg(enrichLLM ? 'Reading your document and checking for risks…' : 'Checking your document for risks…');
    fetch(API + '/api/analyze', {method: 'POST', body: fd,signal:current.controller.signal})
      .then(function(res) { return res.json().then(function(data) { return {res: res, data: data}; }); })
      .then(function(x) {
        if(reportRequest.current!==current||current.controller.signal.aborted)return;
        if (!x.res.ok) throw new Error(x.data.error || x.data.hint || 'Analysis failed');
        var data = x.data;
        if (data.freePreview && data.issuesLocked) {
          data.issues = (data.issues || []).concat((data.issuesLocked || []).map(function(p) {
            return Object.assign({}, p, {
              analysis: 'Unlock for full analysis & recommendations.',
              recommendation: '',
              impact: '',
              locked: true
            });
          }));
          data._locked = true;
        }
        setResult(data);
        setView('result');
        track('analysis_view', {score: data.score, level: data.level, jurisdiction: data.jurisdiction || jurisdiction, issues: data.issuesCount});
        window.scrollTo({top: 0, behavior: 'smooth'});
      })
      .catch(function(e) {
        if(reportRequest.current!==current)return;
        setError(current.timedOut?'The scan took too long. Please try again with a smaller file.':e.message || 'Analysis failed');
        track('analyze_error', {message: String(e.message || '').slice(0, 80)});
      })
      .finally(function() {finishReportRequest(current);});
  }, [jurisdiction, enrichLLM, config.maxFileMb]);

  function onFile(e) {
    var f = e.target.files && e.target.files[0];
    if (f) runFile(f);
    e.target.value = '';
  }

  const startPay = ({amount, label, product})=>{
    setError('');
    const key = config.paystackPublicKey;
    if(!key || !window.PaystackPop){
      setError('Checkout is unavailable right now. Please try again shortly.');window.scrollTo({top:0});
      return;
    }
    const email = payEmail.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){beginCheckout({amount,product});return;}
    setPayEmail(email);
    track('paywall_click',{product,amount});
    const handler = PaystackPop.setup({
      key,
      email,
      amount,
      currency: 'ZAR',
      ref: 'CC-'+crypto.randomUUID(),
      metadata: { product, analysisId: result?._id||'' },
      callback: function(response){
        setRestoreRef(response.reference);
        saveLS({pendingReceipt:response.reference,email});
        fetch(API+'/api/verify-payment',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({reference: response.reference, email, product})
        }).then(r=>r.json()).then(async v=>{
          if(!v.ok) throw new Error(v.error||'Verification failed');
          setPaymentRef(v.grantId);
          setCredits(v.credits||0);
          if(product==='single' && result?._id){
            const full = await fetch(API+'/api/unlock-analysis',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body: JSON.stringify({analysisId: result._id, reference: response.reference, email})
            }).then(r=>r.json());
            if(full.error) throw new Error(full.error);
            rememberPaidReport(full,response.reference,email);
            setResult(full);
            setCredits(full.credits||0);
            setUnlocked(u=>[...new Set([...u, result._id])]);
          } else {
            setCredits(c=>Math.max(c, v.credits||0));
            setNotice(v.credits+' report credits added. Upload a document to use them.');window.scrollTo({top:0});
          }
        }).catch(err=>{
          setError('Payment verification or unlock failed: '+err.message+'. Keep your reference: '+response.reference);window.scrollTo({top:0});
        });
      },
      onClose: function(){ track('pay_close',{product}); }
    });
    handler.openIframe();
  };

  async function restoreReceipt(e) {
    e.preventDefault();
    if(restoring)return;
    setRestoring(true);setError('');
    try {
      const response=await fetch(API+'/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reference:restoreRef.trim(),email:payEmail.trim()})});
      const v=await response.json();
      if(!response.ok||!v.ok)throw new Error(v.error||'Could not verify receipt');
      setPaymentRef(v.grantId);setCredits(v.credits);setPayEmail(v.email);
      setRecoveredReports({reports:Array.isArray(v.reports)?v.reports:[],reference:v.grantId,email:v.email});
      setNotice('Receipt restored: '+v.credits+' report credits remaining. '+(v.reports?.length?'Reopen a retained report below without using another credit.':'No retained reports are available for this receipt. You can use remaining credits for a new scan.'));
    } catch(err){setError(err.message||'Could not restore receipt. Please try again.');}
    finally{setRestoring(false);window.scrollTo({top:0});}
  }

  const unlock = async ()=>{
    if(!result || unlocking) return;
    setUnlocking(true);
    try {
    if(payEmail && paymentRef){
      const full = await fetch(API+'/api/unlock-analysis',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body: JSON.stringify({analysisId: result._id, reference:paymentRef, email: payEmail})
      }).then(r=>r.json());
      if(full.error){ if(full.error==='No report credits remaining'){setCredits(0);setPaymentRef('');} setError(full.error);window.scrollTo({top:0});return; }
      rememberPaidReport(full,paymentRef,payEmail);
      setResult(full);
      setCredits(full.credits||0);
      setUnlocked(u=>[...new Set([...u, result._id])]);
      return;
    }
    beginCheckout({amount: config.prices.single, label:'Full Report R19', product:'single'});
    } catch(e){setError('Unable to unlock this report. Please check your connection and try again.');window.scrollTo({top:0});} finally {setUnlocking(false);}
  };

  function exportPdf() {
    if (!result || !isUnlocked) return;
    if (!window.jspdf){setError('PDF export is unavailable. Please check your connection and try again.');window.scrollTo({top:0});return;}
    var jsPDF = window.jspdf.jsPDF;
