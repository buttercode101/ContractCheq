 s8","riskScore":"88/100","severity":"HIGH THREAT","excerpt":"rest will accrue on the deposit. Tenant consents to the landlord selling the tenant ID number, biometric data and bank statements to third-party marketing partners.","analysis":"POPIA requires specific, informed consent and purpose limitation. Blanket consent to sell ID numbers or biometric data to marketing partners exceeds what is reasonably necessary and violates data minimisation.","recommendation":"Strike marketing sale clauses. Limit consent to credit checks strictly necessary for this agreement; require deletion after vetting.","impact":"Complaints to the Information Regulator; personal data exposure and fraud risk.","tags":["POPIA"],"rawScore":88,"source":"rules"}],"highlightedClauses":["ESIDENTIAL LEASE AGREEMENT Landlord may enter the premises a","tice for inspection or maintenance. The deposit is non-refun","rest will accrue on the deposit. Tenant consents to the land"],"extraction":{"method":"engine-snapshot","pages":1,"confidence":1}},"employment":{"_id":"demo-sample-employment","isDemo":true,"isPaid":true,"freePreview":false,"score":70,"level":"High Risk","issuesCount":2,"exposure":"R15,000 – R80,000","docTitle":"Employment Offer Letter (demo)","docType":"Employment • demo","jurisdiction":"ZA","rulesVersion":"3.0-sa-2026","issues":[{"id":"bcea-0","law":"BCEA s9 & s10","lawRef":"BCEA s9 & s10 • BCEA s14","riskScore":"82/100","severity":"HIGH THREAT","excerpt":"EMPLOYMENT OFFER The employee shall work 55 hours per week. Overtime is unpaid. Employee waives meal intervals. Remuneration is below the","analysis":"BCEA limits ordinary hours to 45 per week. Overtime is limited and must be paid at 1.5×. Waiver of meal intervals after 5 hours and a blanket 55-hour week without compensation contravenes s9, s10 and s14; such waivers are void under s2.","recommendation":"Cap ordinary hours at 45. Provide a separate written overtime agreement with premium pay. Guarantee a 60-minute meal interval after 5 continuous hours.","impact":"Unpaid labour claim and CCMA dispute; employer may be liable for arrears.","tags":["BCEA","LRA"],"rawScore":82,"source":"rules"},{"id":"cpa-unfair-1","law":"CPA s48","lawRef":"CPA s48 • CPA s51","riskScore":"72/100","severity":"MEDIUM RISK","excerpt":"tory minimum where applicable. Employee waives rights to claim under the BCEA.","analysis":"CPA s48 prohibits unfair, unreasonable or unjust terms. Over-broad indemnities and total exclusion of liability are frequently limited or struck down by courts and the National Consumer Tribunal.","recommendation":"Narrow any indemnity to losses caused by the other party’s negligence. Remove total liability exclusions.","impact":"Clause may be declared void; residual exposure remains.","tags":["CPA"],"rawScore":72,"source":"rules"}],"highlightedClauses":["EMPLOYMENT OFFER The employee shall work 55 hours per week. ","tory minimum where applicable. Employee waives rights to cla"],"extraction":{"method":"engine-snapshot","pages":1,"confidence":1}},"ukTenancy":{"_id":"demo-sample-uk-tenancy","isDemo":true,"isPaid":true,"freePreview":false,"score":90,"level":"High Risk","issuesCount":4,"exposure":"£10,000 – £50,000","docTitle":"Assured Shorthold Tenancy (demo)","docType":"Lease / Tenancy • demo","jurisdiction":"UK","rulesVersion":"1.0-uk-2026","issues":[{"id":"uk-deposit-cap-0","law":"Tenant Fees Act 2019","lawRef":"Tenant Fees Act 2019 • Housing Act 2004","riskScore":"88/100","severity":"HIGH THREAT","excerpt":"ENANCY AGREEMENT The Tenant shall pay a security deposit equal to eight weeks rent. The deposit is non-refundable if the Tenant leaves early. The Landlord ma","analysis":"In England, the Tenant Fees Act 2019 caps tenancy deposits (typically 5 weeks' rent where annual rent is under £50,000). Non-refundable deposits are generally not a lawful substitute for a protected deposit.","recommendation":"Cap the deposit at the legal maximum and protect it in an authorised scheme with prescribed information within 30 days.","impact":"Deposit protection claim; possible penalties; s21 notice risks.","tags":["UK","Tenancy"],"rawScore":88,"source":"rules"},{"id":"uk-s21-trap-1","law":"Housing Act 1988 s21","lawRef":"Housing Act 1988 s21 • Deregulation Act 2015","riskScore":"70/100","severity":"MEDIUM RISK","excerpt":"e Tenant leaves early. The Landlord may terminate the tenancy without reason on two weeks notice. The Tenant consents to the Landlord selling personal data","analysis":"Section 21 possession has strict prerequisites (deposit protection, prescribed information, licensing, gas safety, EPC). Bare “evict without reason” wording overstates landlord rights.","recommendation":"Use lawful notice wording and confirm all statutory prerequisites before any notice is served.","impact":"Invalid notice; delayed possession; costs.","tags":["UK","Tenancy"],"rawScore":70,"source":"rules"},{"id":"uk-unfair-2","law":"Consumer Rights Act 2015","lawRef":"Consumer Rights Act 2015 • Unfair Contract Terms Act 1977","riskScore":"86/100","severity":"HIGH THREAT","excerpt":"al data to marketing partners. Landlord excludes all liability for negligence including personal injury.","analysis":"The Consumer Rights Act 2015 and UCTA restrict exclusion of liability for negligence causing death or personal injury and unfair terms in consumer contracts.","recommendation":"Remove statutory-rights waivers. Limit exclusions to what the law allows.","impact":"Unenforceable terms; regulatory action; refund claims.","tags":["UK","Consumer"],"rawScore":86,"source":"rules"},{"id":"uk-gdpr-3","law":"UK GDPR","lawRef":"UK GDPR • Data Protection Act 2018","riskScore":"85/100","severity":"HIGH THREAT","excerpt":"reason on two weeks notice. The Tenant consents to the Landlord selling personal data to marketing partners. Landlord excludes all liability for negligence including personal inj","analysis":"UK GDPR requires a lawful basis and purpose limitation. Blanket consent to sell personal data for marketing is high-risk.","recommendation":"Separate marketing consent; allow easy withdrawal; minimise data shared.","impact":"ICO complaint; fines; loss of trust.","tags":["UK","Privacy"],"rawScore":85,"source":"rules"}],"highlightedClauses":["ENANCY AGREEMENT The Tenant shall pay a security deposit equ","e Tenant leaves early. The Landlord may terminate the tenanc","al data to marketing partners. Landlord excludes all liabili","reason on two weeks notice. The Tenant consents to the Landl"],"extraction":{"method":"engine-snapshot","pages":1,"confidence":1}}};

async function track(name, props) {
  try {
    await fetch(API + '/api/events', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, props: props || {}})
    });
  } catch (e) {}
}

function loadLS() {
  try { return JSON.parse(localStorage.getItem('cc_v3') || '{}'); } catch (e) { return {}; }
}
function saveLS(p) {
  var cur = loadLS();
  localStorage.setItem('cc_v3', JSON.stringify(Object.assign({}, cur, p)));
}

function Gauge(props) {
  var score = props.score || 0;
  var level = props.level || '';
  var r = 54;
  var c = 2 * Math.PI * r;
  var pct = Math.min(100, Math.max(0, score)) / 100;
  var offset = c * (1 - pct * 0.75);
  var col = score >= 70 ? '#dc2626' : score >= 40 ? '#d97706' : '#16a34a';
  return h('div', {className: 'relative w-36 h-36 mx-auto'},
    h('svg', {viewBox: '0 0 140 140', className: 'w-full h-full', style: {transform: 'rotate(-135deg)'}},
      h('circle', {cx: 70, cy: 70, r: r, fill: 'none', stroke: '#e2e8f0', strokeWidth: 12, strokeDasharray: (c * 0.75) + ' ' + c}),
      h('circle', {cx: 70, cy: 70, r: r, fill: 'none', stroke: col, strokeWidth: 12, strokeLinecap: 'round', strokeDasharray: (c * 0.75) + ' ' + c, strokeDashoffset: offset})
    ),
    h('div', {className: 'absolute inset-0 flex flex-col items-center justify-center'},
      h('div', {className: 'text-3xl font-bold'}, score),
      h('div', {className: 'text-[10px] font-bold uppercase tracking-wide', style: {color: col}}, level)
    )
  );
}

function App() {

  var _u = useState(ls.unlocked || []); var unlocked = _u[0]; var setUnlocked = _u[1];

  useEffect(function() {

  var openDemo = useCallback(function(key) {

    setError('');

    setResult(d);
    setView('result');
    track('demo_open', {id: key});
    window.scrollTo({top: 0, behavior: 'smooth'});
  }, []);

  var runFile = useCallback(function(file) {
    if (!file) return;
    setError('');
    setScanning(true);
    setScanMsg('Reading document…');
    track('upload_start', {jurisdiction: jurisdiction, name: file.name});
    var fd = new FormData();
    fd.append('file', file);
    fd.append('jurisdiction', jurisdiction);
    if (enrichLLM) fd.append('enrich', '1');
    setScanMsg(enrichLLM ? 'OCR + rules + AI…' : 'OCR + rules…');
    fetch(API + '/api/analyze', {method: 'POST', body: fd})
      .then(function(res) { return res.json().then(function(data) { return {res: res, data: data}; }); })
      .then(function(x) {
        if (!x.res.ok) throw new Error(x.data.error || x.data.hint || 'Analysis failed');
        var data = x.data;
        if (data.freePreview && data.issuesLocked) {
          data.issues = (data.issues || []).concat((data.issuesLocked || []).map(function(p) {
            return Object.assign({}, p, {
              analysis: 'Unlock for full analysis & recommendations.',
              recommendation: '',
              impact: '',
              locked: true
            });
          }));
          data._locked = true;
        }
        setResult(data);
        setView('result');
        track('analysis_view', {score: data.score, level: data.level, jurisdiction: data.jurisdiction || jurisdiction, issues: data.issuesCount});
        window.scrollTo({top: 0, behavior: 'smooth'});
      })
      .catch(function(e) {
        setError(e.message || 'Analysis failed');
        track('analyze_error', {message: String(e.message || '').slice(0, 80)});
      })
      .finally(function() {
        setScanning(false);
        setScanMsg('');
      });
  }, [jurisdiction, enrichLLM]);

  function onFile(e) {
    var f = e.target.files && e.target.files[0];
    if (f) runFile(f);
    e.target.value = '';
  }

  const startPay = ({amount, label, product})=>{
    const key = config.paystackPublicKey;
    if(!key || !window.PaystackPop){
      alert('Checkout is not available yet. Please try again later.');
      return;
    }
    const email = payEmail || prompt('Email for receipt & credits:') || '';
    if(!email) return;
    setPayEmail(email);
    track('paywall_click',{product,amount});
    const handler = PaystackPop.setup({
      key,
      email,
      amount,
      currency: 'ZAR',
      ref: 'CC-'+crypto.randomUUID(),
      metadata: { product, analysisId: result?._id||'' },
      callback: function(response){
        fetch(API+'/api/verify-payment',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({reference: response.reference, email, product})
        }).then(r=>r.json()).then(async v=>{
          if(!v.ok) throw new Error(v.error||'Verification failed');
          setPaymentRef(v.grantId);
          setCredits(v.credits||0);
          if(product==='single' && result?._id){
            const full = await fetch(API+'/api/unlock-analysis',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body: JSON.stringify({analysisId: result._id, reference: response.reference, email})
            }).then(r=>r.json());
            if(full.error) throw new Error(full.error);
            setResult(full);
            setCredits(full.credits||0);
            setUnlocked(u=>[...new Set([...u, result._id])]);
            track('unlock_success',{via:'payment'});
          } else {
            setCredits(c=>Math.max(c, v.credits||0));
            alert('Credits added: '+v.credits+'. Use them to unlock any report.');
          }
        }).catch(err=>{
          alert('Payment received but unlock failed: '+err.message+'\nRef: '+response.reference);
        });
      },
      onClose: function(){ track('pay_close',{product}); }
    });
    handler.openIframe();
  };

  const unlock = async ()=>{
    if(!result) return;
    if(credits>0 && payEmail && paymentRef){
      const full = await fetch(API+'/api/unlock-analysis',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body: JSON.stringify({analysisId: result._id, reference:paymentRef, email: payEmail})
      }).then(r=>r.json());
      if(full.error){ alert(full.error); return; }
      setResult(full);
      setCredits(full.credits||0);
      setUnlocked(u=>[...new Set([...u, result._id])]);
      track('unlock_success',{via:'credit'});
      return;
    }
    startPay({amount: config.prices.single, label:'Full Report R19', product:'single'});
  };

  function exportPdf() {
    if (!result || !window.jspdf) return;
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF();
    var y = 16;
    function line(t, s) {
      s = s || 11;
      var lines = doc.splitTextToSize(t, 180);
      doc.setFontSize(s);
      doc.text(lines, 14, y);
      y += lines.length * (s * 0.45) + 4;
      if (y > 280) { doc.addPage(); y = 16; }
    }
    doc.setFontSize(16);
    doc.text('ContractCheck Report', 14, y);
    y += 8;
    line('Score: ' + result.score + '/100 · ' + result.level + ' · ' + (result.jurisdiction || 'ZA'), 11);
    line(result.docTitle || '', 10);
    line('DISCLAIMER: Preliminary triage only. Not legal advice. Consult a qualified attorney.', 8);
    y += 2;
    (result.issues || []).forEach(function(iss, i) {
      line((i + 1) + '. [' + (iss.severity || '') + '] ' + (iss.law || ''), 11);
      if (iss.excerpt) line('Excerpt: ' + iss.excerpt, 9);
      if (iss.analysis) line(iss.analysis, 9);
      if (iss.recommendation) line('Ask attorney: ' + iss.recommendation, 9);
      y += 2;
    });
    doc.save('ContractCheck-' + (result._id || 'report') + '.pdf');
    track('export_pdf', {id: result._id});
  }

      h('div', {className: 'mt-4 flex flex-wrap gap-2 justify-center'},

        }, '🇿🇦 South Africa'),
        h('button', {

      h('div', {className: 'mt-8 rounded-3xl border-2 border-dashed border-slate-300 bg-white p-10 text-center'},

        (isUnlocked || result.isDemo)

        h('h2', {className: 'serif text-2xl mt-1'}, result.docTitle),
        h('div', {className: 'mt-6'}, h(Gauge, {score: result.score, level: result.level})),
        h('div', {className: 'mt-4 grid grid-cols-2 gap-3'},
          h('div', {className: 'rounded-2xl bg-slate-50 p-4'},
            h('div', {className: 'text-[10px] font-bold text-slate-500'}, 'ISSUES'),
            h('div', {className: 'text-xl font-bold'}, result.issuesCount)
          ),
          h('div', {className: 'rounded-2xl bg-amber-50 border border-amber-100 p-4'},
            h('div', {className: 'text-[10px] font-bold text-amber-800'}, 'EXPOSURE'),
            h('div', {className: 'text-base font-bold text-amber-900'}, isUnlocked ? result.exposure : '••••')
          )

        result.extraction && result.extraction.warning && h('p', {className: 'mt-3 text-xs text-amber-700'}, result.extraction.warning),
        result.llmEnriched && h('p', {className: 'mt-2 text-[11px] text-violet-700'}, 'AI enrichment applied' + (result.llmModel ? ' · ' + result.llmModel : ''))
      ),
      (!result.isDemo && (!isUnlocked || result._locked)) && h('div', {className: 'mt-6 rounded-2xl border-2 border-dashed border-blue-300 bg-blue-50/50 p-6 text-center'},
        h('div', {className: 'text-sm font-semibold'}, '3 flags unlocked free · full report R19'),
        h('p', {className: 'mt-1 text-xs text-slate-600'}, 'Includes all recommendations, exposure estimate, and PDF export.'),
        h('button', {onClick: unlock, className: 'mt-4 rounded-full bg-blue-600 text-white px-8 py-3 text-sm font-semibold'}, 'Unlock — R19'),
        h('div', {className: 'mt-3'},
          h('input', {
            className: 'rounded-full border px-3 py-1.5 text-xs w-56',
            placeholder: 'Email for credits',
            value: payEmail,
            onChange: function(e) { setPayEmail(e.target.value); }
          })
        )
      ),
      h('div', {className: 'mt-8 space-y-4'},
        issues.map(function(m, idx) {
          return h('div', {key: m.id || idx, className: 'rounded-[24px] bg-white border shadow-sm overflow-hidden'},
            h('div', {className: 'h-1.5 ' + (String(m.severity || '').indexOf('HIGH') >= 0 ? 'bg-red-600' : 'bg-amber-500')}),
            h('div', {className: 'p-6'},
              h('div', {className: 'flex flex-wrap gap-2'},
                h('span', {className: 'px-3 py-1 rounded-full bg-slate-900 text-white text-[10px] font-bold'}, m.severity || 'FLAG'),
                h('span', {className: 'px-2.5 py-1 rounded-full bg-red-50 border border-red-200 text-red-700 text-[10px] font-bold'}, m.law),
                h('span', {className: 'px-2.5 py-1 rounded-full bg-slate-50 border text-[10px] font-bold'}, m.riskScore),
                m.source === 'groq' && h('span', {className: 'px-2.5 py-1 rounded-full bg-violet-50 border border-violet-200 text-violet-700 text-[10px] font-bold'}, 'AI-suggested')

              m.excerpt && h('p', {className: 'mt-3 text-sm text-slate-700 italic border-l-2 border-slate-200 pl-3'}, m.excerpt),
              (isUnlocked && !m.locked)
                ? h('div', {className: 'mt-4 space-y-2 text-sm text-slate-700'},
                    h('p', null, m.analysis),
                    m.recommendation && h('p', null, h('strong', null, 'Ask a lawyer: '), m.recommendation),
                    m.impact && h('p', {className: 'text-xs text-slate-500'}, 'Impact: ', m.impact),
                    m.lawRef && h('p', {className: 'text-[11px] font-semibold text-slate-500'}, m.lawRef)
                  )
                : m.locked
                  ? h('p', {className: 'mt-3 text-sm text-slate-500'}, '🔒 Unlock for full analysis & recommendations.')
                  : h('div', {className: 'mt-3 text-sm text-slate-700'}, m.analysis)
            )
          );
        })
      ),

        h('div', {className: 'mt-4 flex flex-wrap gap-2'},
          h('a', {
            href: (result.jurisdiction || jurisdiction) === 'UK'

            target: '_blank',
            rel: 'noopener',
            onClick: function() { track('attorney_referral_click', {jurisdiction: result.jurisdiction || jurisdiction, score: result.score}); },
            className: 'rounded-full bg-red-700 text-white px-5 py-2.5 text-xs font-semibold'

          h('a', {
            href: (result.jurisdiction || jurisdiction) === 'UK' ? 'https://www.citizensadvice.org.uk/' : 'https://www.legal-aid.co.za/',
            target: '_blank',
            rel: 'noopener',
            className: 'rounded-full bg-white border border-red-200 text-red-800 px-5 py-2.5 text-xs font-semibold'
          }, (result.jurisdiction || jurisdiction) === 'UK' ? 'Citizens Advice' : 'Legal Aid SA')

      ),
      h('div', {className: 'mt-8 rounded-2xl bg-white border p-5'},
        h('div', {className: 'text-xs font-bold text-slate-500'}, 'PRIVATE NOTES (saved on this device only)'),

          className: 'mt-2 w-full rounded-xl border p-3 text-sm min-h-[80px]',
          placeholder: 'Your private annotations…',
          value: notes[result._id] || '',
          onChange: function(e) {
            var v = e.target.value;
            setNotes(function(n) {
              var o = Object.assign({}, n);
              o[result._id] = v;
              return o;
            });
          }
        })
      ),
      h('p', {className: 'mt-6 text-center text-[11px] text-slate-400'}, 'Not legal advice. Consult an attorney. We do not rewrite clauses.')
    );
  }

        h('span', {className: ok ? '' : 'text-slate-400'}, text)

    }
    var plans = [
      {
        product: 'free',
        label: 'Free scan',
        price: 'R0',
        sub: 'Try before you pay',
        cta: 'Upload a contract',
        popular: false,
        amount: 0,
        features: [
          [true, 'Risk score 0–100 + risk level'],
          [true, 'Document type detection (lease, employment, etc.)'],
          [true, 'Full write-up on first 3 flagged issues'],
          [true, 'SA or UK rule pack'],
          [true, 'Titles of any remaining issues'],
          [false, 'Full recommendations on every issue'],
          [false, 'Financial exposure estimate'],
          [false, 'PDF export'],
          [false, 'Optional AI enrichment unlocked in report']
        ]
      },
      {
        product: 'single',
        label: 'Full report',
        price: 'R19',
        sub: 'One contract, fully unlocked',
        cta: 'Buy R19',
        popular: true,
        amount: config.prices.single,
        features: [
          [true, 'Everything in Free'],
          [true, 'All issues fully unlocked'],
          [true, 'Plain-English analysis per flag'],
          [true, '“Ask a lawyer” recommendations'],
          [true, 'Impact notes + law references'],
          [true, 'Financial exposure band'],
          [true, 'PDF export'],
          [true, 'High-risk attorney / solicitor links'],
          [true, 'Private notes on this device']
        ]
      },
      {
        product: 'pack3',
        label: '3-pack',
        price: 'R39',
        sub: '~R13 per report · keep your payment receipt',
        cta: 'Buy R39',
        popular: false,
        amount: config.prices.pack3,
        features: [
          [true, '3 full-report unlock credits'],
          [true, 'Same as Full report each time'],
          [true, 'Use on any scans (SA or UK)'],
          [true, 'Verified receipt and email required'],
          [true, 'Best if you have a few contracts now']
        ]
      },
      {
        product: 'pack10',
        label: '10-pack',
        price: 'R99',
        sub: '~R10 per report · best value',
        cta: 'Buy R99',
        popular: false,
        amount: config.prices.pack10,
        features: [
          [true, '10 full-report unlock credits'],
          [true, 'Same as Full report each time'],
          [true, 'Use on any scans (SA or UK)'],
          [true, 'Verified receipt and email required'],
          [true, 'Best for agents, HR, or repeat use']
        ]
      }
    ];
    body = h('section', {className: 'pt-8 max-w-4xl mx-auto'},
      h('h1', {className: 'serif text-3xl sm:text-4xl text-center'}, 'Simple, honest pricing'),
      h('p', {className: 'text-center text-sm text-slate-600 mt-2 max-w-xl mx-auto'},
        'Check & Flag Only — not legal advice. Pay only when you need the full report. No monthly subscription required.'
      ),
      h('div', {className: 'mt-8 grid sm:grid-cols-2 lg:grid-cols-4 gap-4'},
        plans.map(function(p) {
          return h('div', {
            key: p.product,
            className: 'rounded-2xl bg-white border p-5 flex flex-col relative ' + (p.popular ? 'border-blue-500 shadow-md ring-1 ring-blue-200' : '')
          },
            p.popular && h('div', {className: 'absolute -top-2.5 left-1/2 -translate-x-1/2 px-2 py-0.5 rounded-full bg-blue-600 text-white text-[10px] font-bold'}, 'FULL ACCESS'),
            h('div', {className: 'text-xs font-bold uppercase tracking-wide text-slate-500'}, p.label),
            h('div', {className: 'text-3xl font-bold mt-1'}, p.price),
            h('div', {className: 'text-[11px] text-slate-500 mt-1 min-h-[32px]'}, p.sub),
            h('ul', {className: 'mt-4 space-y-2 flex-1'},
              p.features.map(function(f, i) { return h(React.Fragment, {key: i}, feature(f[0], f[1])); })
            ),
            p.product === 'free'
              ? h('button', {
                  onClick: function() { setView('landing'); window.scrollTo({top: 0, behavior: 'smooth'}); },
                  className: 'mt-5 w-full rounded-full border border-slate-300 bg-white text-slate-900 py-2.5 text-sm font-semibold'
                }, p.cta)
              : h('button', {
                  onClick: function() { startPay({amount: p.amount, product: p.product}); },
                  className: 'mt-5 w-full rounded-full py-2.5 text-sm font-semibold ' + (p.popular ? 'bg-blue-600 text-white' : 'bg-slate-900 text-white')
                }, p.cta)
          );
        })
      ),
      h('div', {className: 'mt-10 rounded-2xl bg-slate-50 border p-6 text-sm text-slate-700 space-y-3'},
        h('h2', {className: 'font-bold text-slate-900'}, 'What you get in every full report'),
        h('ul', {className: 'grid sm:grid-cols-2 gap-2 list-disc pl-5'},
          h('li', null, 'Risk score and High / Medium / Low level'),
          h('li', null, 'Each flag with severity and law reference'),
          h('li', null, 'Excerpt from your contract that triggered the flag'),
          h('li', null, 'Plain-English analysis (why it matters)'),
          h('li', null, 'Recommendation to discuss with an attorney'),
          h('li', null, 'Indicative financial exposure band'),
          h('li', null, 'PDF download for your records'),
          h('li', null, 'Links to find an SA attorney or UK solicitor on high risk')
        ),
        h('h2', {className: 'font-bold text-slate-900 pt-2'}, 'What we do not do'),
        h('ul', {className: 'list-disc pl-5 space-y-1'},
          h('li', null, 'We do not give legal advice or create an attorney–client relationship'),
          h('li', null, 'We do not rewrite or redline your contract'),
          h('li', null, 'We do not replace a qualified attorney for high-stakes decisions')
        ),
        h('h2', {className: 'font-bold text-slate-900 pt-2'}, 'Optional AI enrichment'),
        h('p', null, 'If you tick “AI enrichment” on upload, Groq may add extra suggested flags and TinyFish may attach public web research notes. The core SA/UK rule engine always runs first. AI findings are labelled “AI-suggested”.'),
        h('h2', {className: 'font-bold text-slate-900 pt-2'}, 'Payments & credits'),
        h('p', null, 'Paystack processes card payments in ZAR. Pack credits are linked to your verified payment receipt and email. Keep both to use your remaining credits and contact support.')
      ),
      h('button', {onClick: function() { setView('landing'); }, className: 'mt-8 block mx-auto text-sm font-semibold text-blue-600'}, '← Back')
    );
  }

  if (view === 'privacy') {
    body = h('section', {className: 'pt-10 max-w-2xl mx-auto space-y-4 text-[14px] text-slate-700'},
      h('h1', {className: 'serif text-3xl font-bold'}, 'Privacy Policy'),
      h('p', null, 'Files are processed to extract text and produce a risk report. We do not sell your documents.'),
      h('p', null, 'Uploaded files are deleted from the server after processing. Analysis results expire after 48 hours; expired records are removed by the daily cleanup so you can unlock after payment.'),
      h('p', null, 'If you enable AI enrichment, text excerpts are sent to Groq and/or TinyFish under their terms. Disable AI enrichment to keep analysis on our rules engine only.'),
      h('p', null, 'Payments are processed by Paystack. We receive payment confirmation, not your full card number.'),
      h('button', {onClick: function() { setView('landing'); }, className: 'text-sm font-semibold text-blue-600'}, '← Back')
    );
  }

  if (view === 'terms') {
    body = h('section', {className: 'pt-10 max-w-2xl mx-auto space-y-4 text-[14px] text-slate-700'},
      h('h1', {className: 'serif text-3xl font-bold'}, 'Terms of Use'),
      h('p', null, 'ContractCheck provides automated risk triage only. It is not a law firm and does not provide legal advice. No attorney–client relationship is created.'),
      h('p', null, 'Check & Flag Only: we identify potential issues and cite publicly known legal themes; we do not draft or rewrite contracts for you.'),
      h('p', null, 'Results may be incomplete or incorrect. Always consult a qualified attorney for decisions that matter.'),
      h('p', null, 'Pricing: digital delivery after Paystack verification. Refunds case-by-case if unlock fails after successful payment (provide reference).'),
      h('button', {onClick: function() { setView('landing'); }, className: 'text-sm font-semibold text-blue-600'}, '← Back')
    );
  }

  if (view === 'contact') {
    body = h('section', {className: 'pt-10 max-w-lg mx-auto'},
      h('h1', {className: 'serif text-3xl font-bold text-center'}, 'Contact'),
      h('p', {className: 'mt-4 text-center text-sm text-slate-600'}, 'Support & payment issues'),
      h('p', {className: 'mt-6 text-center text-sm'}, 'Email: ', h('a', {className: 'text-blue-600 font-semibold', href: 'mailto:support@contractcheck.local'}, 'support@contractcheck.local')),
      h('p', {className: 'mt-2 text-center text-xs text-slate-500'}, 'Include your Paystack reference for payment problems.'),
      h('button', {onClick: function() { setView('landing'); }, className: 'mt-6 block mx-auto text-sm font-semibold text-blue-600'}, '← Back')
    );
  }

  return h('div', {className: (view === 'pricing' ? 'max-w-5xl' : 'max-w-3xl') + ' mx-auto px-4 pb-24'},
    h('header', {className: 'flex items-center justify-between py-5'},
      h('button', {
        onClick: function() { setView('landing'); setResult(null); },
        className: 'text-left'
      },
        h('div', {className: 'serif text-2xl font-normal'}, 'ContractCheck'),
        h('div', {className: 'text-[10px] font-semibold tracking-widest text-slate-500 uppercase'}, 'Check & Flag Only')
      ),
      h('div', {className: 'flex items-center gap-3'},
        nav('Pricing', 'pricing'),
        nav('Privacy', 'privacy'),
        nav('Terms', 'terms'),
        nav('Contact', 'contact'),
        credits > 0 && h('span', {className: 'text-[10px] font-bold bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full'}, credits + ' credits')
      )
    ),
    error && h('div', {className: 'mb-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm p-3'}, error),
    body,
    h('footer', {className: 'mt-16 pt-8 border-t text-center text-[11px] text-slate-400'},
      'ContractCheck v3 · Not legal advice · © ' + new Date().getFullYear()
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
