name: ContractCheq Production CI

on:
  push:
    branches: ["deployment/contractcheck-sa-v3"]
  pull_request:
    branches: ["deployment/contractcheck-sa-v3"]

permissions:
  contents: read

concurrency:
  group: contractcheq-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run contract risk and deployment regression tests
        run: npm test
      - name: Run production smoke test
        run: npm run test:smoke
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Check diff hygiene
        run: git diff --check
